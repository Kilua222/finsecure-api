services:
  - type: web
    name: finsecure-api
    runtime: python
    repo: https://github.com/Kilua222/finsecure-api
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9